function selfTest(){
  const out = [], checks = [];
  const check = (name, got, want) => checks.push({name, got, want, pass:JSON.stringify(got) === JSON.stringify(want)});
  const BAD = /<img src=x|<script>alert|javascript:alert|<b>hostile/i;
  const renderAll = label => {
    Object.keys(VIEW_RENDERERS).forEach(v => {
      const metas = v === 'indicator-detail' ? allInds().slice(0, 3).map(i => i.id).concat(['P9-I1']) : v === 'result-detail' ? appData.programmes.flatMap(p => p.fw.nodes.slice(0, 2).map(n => n.id)).concat(['P9-N1']) : [''];
      if (viewAccess(v) === 'none') return;
      const progs = PROG_VIEWS.includes(v) ? appData.programmes.map(p => p.id) : [appData.current];
      progs.forEach(pid => { appData.current = pid; metas.forEach(m => {
        try { pendingMounts = []; const h = VIEW_RENDERERS[v](m); pendingMounts.forEach(fn => fn()); destroyCharts();
          if (BAD.test(h)) out.push(`FAIL ${label} ${v} ${pid} ${m}: unescaped markup or unsafe link`); }
        catch(e){ out.push(`FAIL ${label} ${v} ${pid} ${m}: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`); } }); });
    });
  };
  const saved = {org:appData.org, programmes:appData.programmes, current:appData.current, setup:appData.setup, overrides:appData.overrides, log:appData.log};
  // 1 · Sample organisation
  loadSample();
  const P = appData.programmes;
  check('Sample: 3 programmes · 3 goals · 17 + 9 + 8 indicators', [P.length, appData.org.goals.length, P.map(p => p.fw.indicators.length)], [3, 3, [17, 9, 8]]);
  check('Indicator and node ids unique across programmes', [new Set(allInds().map(i => i.id)).size, new Set(P.flatMap(p => p.fw.nodes.map(n => n.id))).size],
    [allInds().length, P.reduce((t, p) => t + p.fw.nodes.length, 0)]);
  check('Every lookup resolves to its own programme', allInds().every(i => nodeById(i.node) && nodeById(i.node).prog === i.prog && indById(i.id) === i), true);
  check('Every goal has a contributing programme', appData.org.goals.every(g => goalProgs(g.code).length > 0), true);
  check('Every result is labelled illustrative', appData.results.every(r => r.source_type === 'ILLUSTRATIVE'), true);
  const v1 = JSON.stringify(appData.results.map(r => r.value)); generateResults();
  check('Same organisation, same figures (seeded)', JSON.stringify(appData.results.map(r => r.value)), v1);
  check('Unverified results never reach a dashboard', allInds().every(i => { const r = latestOfficial(i); return !r || OFFICIAL.includes(r.state); }), true);
  check('Percent results stay within 0–100', appData.results.filter(r => indById(r.ind).unit === '%' && (r.value < 0 || r.value > 100)).length, 0);
  check('Each programme shows a status mix', P.every(p => { const c = statusCounts(p.fw.indicators); return c.on > 0 && c.on + c.attention + c.off >= 5; }), true);
  check('Budgets: spent never exceeds 110% of budget', P.every(p => p.budget.spent <= p.budget.total * 1.1 && p.budget.total > 0), true);
  check('Light brand colour is darkened for contrast', lum(hexToRgb(brandTokens('#f6e05e')['--brand'])) <= .46, true);
  renderAll('sample');
  // 2 · A hostile organisation: markup everywhere, javascript: links, bad colours
  const H = '<img src=x onerror=alert(1)><b>hostile</b>';
  const hostile = {org:{name:H, short_name:H, sector:H, country:H, type:'NGO', summary:H, mission:H, vision:H, values:[H], focus_areas:[H], founded:H, headquarters:H},
    facts:[{statement:H, source_url:'javascript:alert(1)', category:'mission'}, {statement:'ok', source_url:'https://example.org/a"onmouseover="x', category:'other'}],
    strategic_goals:[{code:H, statement:H, basis:'stated'}], knowledge_basis:'website', warnings:[H],
    programmes:[{name:H, short_name:H, description:H, location:H, period_start:null, period_end:null, goal_codes:[H], target_group:H, basis:'stated', source_url:'javascript:alert(1)'}]};
  const hsite = {url:'javascript:alert(1)', error:H, pages:[{url:'javascript:alert(1)', title:H}, {url:'https://example.org/', title:H}], brand:{theme_color:'red;background:url(x)', swatches:['#zzz', '#abc'], icon:'javascript:alert(1)'}};
  const horg = normaliseOrg(hostile, hsite, {kind:'website', model:H});
  check('Unsafe links dropped at ingestion', [horg.website, horg.facts.map(f => f.url), horg.source.pages.length, horg.brand.logo, horg.brand.primary], ['', [null, null], 1, null, '#aabbcc']);
  const hfw = {title:H, goal:{code:H, statement:'<script>alert(1)<\/script>', indicators:[{code:'<img src=x>', name:'<img src=x onerror=alert(2)>', unit:'<b>hostile</b>', baseline:1, target:5, source_quote:'<img src=x>', notes:'<script>alert(3)<\/script>'}]},
    outcomes:[{code:H, statement:H, indicators:[], outputs:[{code:H, statement:H, indicators:[], activities:[H]}]}], risks:[H], assumptions:[H], warnings:[H]};
  adoptOrganisation(horg, [makeProgramme(hostile.programmes[0], normaliseFramework(hfw, 'P1'), {kind:'drafted', model:H, filename:H}, 0)]);
  appData.log = [{ts:nowStamp(), user:H, icon:'bi-x', text:H, ref:null, old:H, new:H, reason:H}];
  renderAll('hostile');
  // Review screen with the hostile extraction pending
  appData.setup = {stage:'review', tab:'org', org:horg, programmes:[Object.assign(su_newProg({name:H, short:H}), {status:'ready', fw:normaliseFramework(hfw, 'X1'), source:{kind:'drafted', filename:H}})]};
  ['org', appData.setup.programmes[0].key].forEach(tb => { appData.setup.tab = tb; try { const h = VIEW_RENDERERS['review'](''); if (BAD.test(h)) out.push(`FAIL review ${tb}: unescaped markup`); } catch(e){ out.push(`FAIL review ${tb}: ${e.message}`); } });
  ['org','programmes','building'].forEach(st => { appData.setup.stage = st; appData.setup.form = {name:H, website:H, country:H, description:H};

  appData.setup = null;
  // 3 · Awkward frameworks inside one organisation
  const edge = [
    {title:'No dates', goal:{statement:'Goal', indicators:[{code:'', name:'Rate', unit:'%', baseline:null, target:null, direction:'decrease'}]},
     outcomes:[{statement:'Outcome A', indicators:[{name:'Count', unit:'', baseline:5, target:5, direction:'maintain'}], outputs:[{statement:'Output', indicators:[], activities:['x']}]}]},
    {title:'Future programme', period_start:'2031', period_end:'December 2034', goal:{statement:'Goal', indicators:[{name:'People reached', unit:'people', baseline:0, target:1000, target_year:'2034'}]}, outcomes:[]},
    {title:'Year-only dates', period_start:'Jan 2024', period_end:'2026', goal:{statement:'Goal', indicators:[{name:'Mortality', unit:'per 1,000', baseline:40, target:20, direction:'decrease'}]}, outcomes:[]},
    {title:'Empty', goal:{}, outcomes:[]}];
  try {
    adoptOrganisation(normaliseOrg(SAMPLE_PROFILE, null, {kind:'website'}), edge.map((x, i) => makeProgramme({name:x.title, goal_codes:['SG1']}, normaliseFramework(x, `P${i + 1}`), {kind:'upload', filename:'e'}, i)));
    renderAll('edge');
    check('Future programme gets an illustrative six-quarter window', [progById('P2').fw.timelineShifted, progById('P2').quarters.length], [true, 6]);
    check('Year-only dates parse to 1 Jan 2024 – 31 Dec 2026', [progById('P3').fw.periodStart, progById('P3').fw.periodEnd], ['2024-01-01', '2026-12-31']);
    const R3 = appData.results.filter(r => r.prog === 'P3');
    check('A decreasing indicator falls from baseline', R3.length > 1 && R3[R3.length - 1].value < 40, true);
  } catch(e){ out.push(`FAIL edge: ${e && e.stack}`); }
  // 4 · An organisation known only from its logframes: no website, no goals
  adoptOrganisation(minimalOrg(H, {kind:'logframe', nameGiven:true}), [makeProgramme({name:'Water'}, normaliseFramework(SAMPLE_WASH, 'P1'), {kind:'upload', filename:'a.pdf'}, 0),
    makeProgramme({name:H}, normaliseFramework(SAMPLE_YOUTH, 'P2'), {kind:'upload', filename:H}, 1)]);
  renderAll('logframe-only');
  check('Logframe-only organisation: no goals, every screen draws', [appData.org.goals.length, appData.programmes.length], [0, 2]);
  appData.setup = {stage:'org', form:{name:'', website:'', country:'', description:''}, uploads:[{key:'u1', filename:H, payload:{kind:'text', chars:200}, error:null}, {key:'u2', filename:'b.pdf', payload:null, error:H}], lfOrg:H, programmes:[]};
  try { const h = VIEW_RENDERERS['setup'](''); if (BAD.test(h)) out.push('FAIL setup uploads: unescaped markup'); } catch(e){ out.push(`FAIL setup uploads: ${e.message}`); }
  appData.setup = null;
  // 4b · A shared demo. The payload came out of somebody else's browser, so the
  // guards run again on adoption and every screen that shows it must stay inert.
  const shBad = {org:Object.assign({}, horg, {website:'javascript:alert(1)', brand:{primary:'red;background:url(x)', logo:'javascript:alert(1)'},
      facts:[{statement:H, url:'javascript:alert(1)'}],
      source:{kind:'website', model:H, pages:[{url:'javascript:alert(1)', title:H}, {url:'https://example.org/', title:H}]}}),
    programmes:[{id:'P1', name:H, sourceUrl:'javascript:alert(1)', colour:'red;background:url(x)'}]};
  sanitiseShared(shBad);
  check('Shared payload: unsafe link, logo, colour and cited page dropped on adoption',
    [shBad.org.website, shBad.org.brand.logo, shBad.org.brand.primary, shBad.org.facts[0].url,
     shBad.org.source.pages.length, shBad.programmes[0].sourceUrl, shBad.programmes[0].colour],
    ['', null, null, null, 1, null, PROG_COLOURS[0]]);
  check('A demo link is never allowed to be a javascript: URL', [safeUrl('javascript:alert(1)'), safeUrl('https://x.example/?demo=abcdef123456')],
    [null, 'https://x.example/?demo=abcdef123456']);
  // The gate shows the organisation's name as the server stored it — another
  // visitor's text, before anything has been reviewed.
  ['loading', 'gate', 'dead'].forEach(st => {
    appData.share = {slug:'abcdef123456', role:null, loading:st === 'loading', dead:st === 'dead',
      gate:st === 'gate' ? {org_name:H, programmes:3} : null, gateError:H, gateForm:{name:H, email:H, org:H, role:H}};
    check(`Gate (${st}) is a screen only while a link is being opened`, viewAccess('gate'), 'full');
    try { pendingMounts = []; const h = VIEW_RENDERERS['gate'](''); if (BAD.test(h)) out.push(`FAIL gate ${st}: unescaped markup`); }
    catch(e){ out.push(`FAIL gate ${st}: ${e && e.message}`); }
  });
  loadSample();
  ['owner', 'viewer'].forEach(role => {
    appData.share = {slug:'abcdef123456', role, editToken:'0123456789abcdef0123456789abcdef', pass:'1.abc', url:'javascript:alert(1)',
      meta:{opens:2, revision:3, expires_at:H, org_name:H}};
    ['journey', 'settings', 'about'].forEach(v => {
      try { pendingMounts = []; const h = VIEW_RENDERERS[v](''); pendingMounts = [];
        if (BAD.test(h)) out.push(`FAIL ${v} (shared, ${role}): unescaped markup or unsafe link`); }
      catch(e){ out.push(`FAIL ${v} (shared, ${role}): ${e && e.message}`); }
    });
  });
  appData.share = null;
  check('Gate is unreachable once no link is being opened', viewAccess('gate'), 'none');
  // 5 · Ask Eval360 and AI reports: hostile model output must render inert
  loadSample();
  const ctx = aiContext('org');
  check('AI context: whole organisation, all 34 indicators, under 90 KB', [ctx.programmes.length, ctx.programmes.reduce((t, p) => t + p.indicators.length, 0), JSON.stringify(ctx).length < 90000], [3, 34, true]);
  check('AI context for one programme holds only that programme', aiContext('P2').programmes.map(p => p.short_name), ['YSEP']);
  const md = mdToHtml('# Head\n**bold** and <img src=x onerror=alert(1)> [x](javascript:alert(1))\n\n| a | b |\n|---|---|\n| <script>alert(1)<\/script> | 2 |\n\n- one\n- two\n1. first');
  check('Markdown rendered with structure but no live markup', [md.includes('<h4'), md.includes('<b>bold</b>'), md.includes('<table'), md.includes('<ul>'), md.includes('<ol>'), /<img|<script|href=/i.test(md)], [true, true, true, true, true, false]);
  appData.chat = [{role:'user', content:H}, {role:'assistant', content:'**ok** ' + H + '\n| x | y |\n|---|---|\n| ' + H + ' | 1 |', model:H, scope:H}, {role:'error', content:H}];
  const HR = {title:H, subtitle:H, key_messages:[H], sections:[{heading:H, paragraphs:[H], bullets:[H], table_columns:[H, 'b'], table_rows:[[H]]}], recommendations:[{priority:'High', action:H, owner:H, rationale:H}], caveats:[H]};
  appData.aiReports = [{id:'AR1', type:'board', typeName:H, audience:H, length:'short', scopeLabel:H, report:HR, model:H, at:H}]; rw().open = 'AR1';
  ['ask','aireports'].forEach(v => { try { const h = VIEW_RENDERERS[v](''); if (BAD.test(h)) out.push(`FAIL ${v}: unescaped markup`); } catch(e){ out.push(`FAIL ${v}: ${e.message}`); } });
  check('Report document (print / Word) carries no live markup', BAD.test(rwDocument(appData.aiReports[0], true).replace('onclick="window.print()"', '')), false);
  check('Report as plain text includes every section', rwText(appData.aiReports[0]).split(H).length - 1 >= 8, true);
  appData.chat = []; appData.aiReports = []; rw().open = null;
  // 6 · Re-keying a reviewed framework keeps every link
  const rk = rekeyFramework(normaliseFramework(SAMPLE_WASH, 'X3'), 'P7');
  check('Re-keyed framework: every indicator points at a node of the same programme', rk.indicators.every(i => i.prog === 'P7' && rk.nodes.some(n => n.id === i.node)) && rk.nodes.every(n => !n.parent || rk.nodes.some(m => m.id === n.parent)), true);
  Object.assign(appData, saved); if (appData.org){ generateResults(); applyBrand(); }
  const fails = checks.filter(c => !c.pass);
  out.unshift(`CHECKS ${checks.length - fails.length}/${checks.length}` + fails.map(f => `\n  CHECKFAIL ${f.name}: got ${JSON.stringify(f.got)} want ${JSON.stringify(f.want)}`).join(''));
  out.push(`VIEWS ${Object.keys(VIEW_RENDERERS).length} · RESULTS ${out.filter(x => x.startsWith('FAIL')).length} failures`);
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}

/* ═══ 34. INIT ══════════════════════════════════════════════════════════════
   First visit: the set-up wizard, with the sample organisation loaded behind
   it so every screen works. Returning visitor: their organisation. */
(function init(){
  const hash = location.hash.replace('#', '');
  if (hash === 'selftest'){ loadSample(); selfTest(); showView('dashboard'); return; }
  const q = new URLSearchParams(location.search);
  const slug = String(q.get('demo') || '').trim().toLowerCase(), tokenIn = String(q.get('t') || '').trim();
  const returning = loadState();
  if (returning){ generateResults(); applyBrand(); } else loadSample();
  im_checkStatus();
  /* Someone followed a demo link: open that demo, whatever this browser holds. */
  if (SLUG_RE.test(slug)){
    const prev = appData.share && appData.share.slug === slug ? appData.share : null;
    shareOpen(slug, tokenIn || (prev && prev.editToken) || linkToken(slug), prev && prev.pass);
    return;
  }
  const [v, m] = hash.split('/'), meta = decodeURIComponent(m || '');
  if (v && VIEW_RENDERERS[v]){ if (meta.includes('=') && !DETAIL_VIEWS[v]){ FILTERS[v] = parseMeta(meta); showView(v, ''); } else showView(v, meta); }
  else showView(appData.setup && appData.setup.stage === 'review' ? 'review' : returning ? 'dashboard' : 'setup');
})();
</script>
