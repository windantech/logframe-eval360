  downloadBlob(`${slugFile(fw.title)}_indicators_${TODAY_ISO}.csv`, 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n'));
};
ACTIONS['rp-json'] = () => { const fw = appData.fw;
  downloadBlob(`${slugFile(fw.title)}_framework_${TODAY_ISO}.json`, 'application/json', JSON.stringify({framework:fw, source:appData.source, exported:TODAY_ISO}, null, 2)); };

/* ═══ How this works ════════════════════════════════════════════════════════ */
VIEW_RENDERERS['about'] = () => {
  const ai = appData.ai, s = appData.source || {};
  return pageHead('How this works', 'What happens to your document, where each figure comes from, and how to start over.')
    + `<div class="grid-2 mb">${card('Where each figure comes from', `
        <div class="alert-item">${impBadge()}<div class="small">Results, indicator wording, baselines, targets, means of verification and assumptions — from your logframe.</div></div>
        <div class="alert-item">${aiBadge()}<div class="small">Read from your document by AI, then checked by you on the review screen before use. Edits you made are marked on the indicator.</div></div>
        <div class="alert-item">${demoBadge()}<div class="small">Every quarterly result, status and trend. Generated so the demo can show monitoring; the same logframe always gives the same figures. Not your actual results.</div></div>`)}
      ${card('Your document and your data', `<ul class="small" style="margin:0;padding-left:18px;line-height:1.7">
          <li>Word and Excel files are converted to text in your browser. PDFs and text are sent through this site to OpenAI for extraction.</li>
          <li>This site does not store your document. It keeps a count of imports per visitor per day, and token usage for cost tracking — not the content.</li>
          <li>The extracted framework is kept only in this browser (local storage). Nobody else can see it.</li>
          <li>Do not upload documents you are not permitted to share with a third-party AI service.</li></ul>`)}</div>`
    + `<div class="grid-2">${card('Current framework', kvTable([['Framework', esc(appData.fw.title)], ['Source', s.kind === 'sample' ? 'Built-in sample' : esc(s.filename || '—')],
          ['Extracted by', esc(s.model || '—')], ['Extracted', s.extractedAt ? fmtDate(s.extractedAt.slice(0, 10)) : '—'], ['Reviewed and accepted', esc(s.reviewedAt || '—')],
          ['AI import here', ai.available ? `${chip(ai.mock ? 'On — mock mode' : 'On', 'ok')} ${esc(ai.model)}` : chip(ai.offline ? 'Needs the hosted demo' : 'Not configured', 'warn')],
          ['Imports left today', ai.remaining === null || ai.remaining === undefined ? '—' : num(ai.remaining)]]))}
      ${card('Settings', `<div class="form-grid"><div class="fld"><label for="ab-tol">Tolerance band</label>
          <select id="ab-tol" data-action="ab-tol">${[5,10,15,20].map(v => `<option value="${v}"${appData.settings.tolerance === v ? ' selected' : ''}>${v}% — below expected by up to ${v}% = needs attention</option>`).join('')}</select></div></div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)"><div class="small" style="margin-bottom:8px">Remove your framework and history from this browser and return to the sample.</div>
          <button class="btn btn-sm btn-danger" data-action="ab-reset"><i class="bi bi-trash3"></i> Start over</button></div>`)}</div>`;
};
CHANGES['ab-tol'] = t => { const was = appData.settings.tolerance, before = statusCounts(); appData.settings.tolerance = Number(t.value); saveState();
  addLog('changed the tolerance band', {view:'about', meta:''}, 'bi-sliders', {old:was + '%', new:t.value + '%', reason:'Settings'});
  redraw(); const a = statusCounts(); toast(`Tolerance ${was}% → ${t.value}%. Needs attention ${before.attention} → ${a.attention}, off track ${before.off} → ${a.off}.`, 'ok'); };
ACTIONS['ab-reset'] = () => {
  if (!confirm('Remove your framework, edits and history from this browser?')) return;
  clearState(); appData.log = []; appData.draft = null; loadSample(); showView('dashboard'); toast('Cleared. The sample logframe is loaded.', 'ok');
};

/* ═══════════════════════════════════════════════════════════════════════════
   30. ROUTER — one dispatcher: sidebar, topbar, renderer, charts.
   ═══════════════════════════════════════════════════════════════════════════ */
let currentView = 'dashboard', currentMeta = '';
function navBadges(){
  const b = {}, put = (k, n, cls) => { if (n) b[k] = `<span class="nav-badge ${cls}">${n}</span>`; };
  put('review', appData.draft ? 1 : 0, 'warn');
  const lq = lastQ(); put('submissions', lq ? appData.results.filter(r => r.quarter === lq.id && !OFFICIAL.includes(r.state)).length : 0, 'warn');
  put('quality', qualityIssues().filter(q => q.sev === 'bad').length, 'urgent');
  put('indicators', statusCounts().off, 'urgent');
  return b;
}
function buildSidebar(){
  const active = DETAIL_VIEWS[currentView] ? DETAIL_VIEWS[currentView].parent : currentView, badges = navBadges();
  document.getElementById('sb-nav').innerHTML = NAV.map(g => {
    const items = g.items.filter(i => viewAccess(i.key) !== 'none');
    return items.length ? `<div class="sb-group">${esc(g.group)}</div>` + items.map(i => `<button class="nav-item${active === i.key ? ' active' : ''}" data-action="go" data-view="${i.key}" data-nav="1">
        <i class="bi ${i.icon}"></i><span>${esc(i.label)}</span>${badges[i.key] || ''}</button>`).join('') : '';
  }).join('');
}
function updateChrome(){
  const ai = appData.ai, p = document.getElementById('ai-pill');
  if (p){ p.className = 'chip ' + (!ai.checked ? 'grey' : ai.available ? 'ok' : 'warn');
    p.innerHTML = `<i class="bi bi-stars"></i> ${!ai.checked ? 'Checking AI…' : ai.available ? (ai.mock ? 'AI import (mock)' : 'AI import on') : 'AI import off'}`; }
  const o = document.getElementById('sb-org'); if (o && appData.fw) o.textContent = isSample() ? 'Sample programme' : (appData.fw.organisation || appData.fw.title).slice(0, 40);
  const q = qualityIssues().filter(x => x.sev !== 'info').length, t = document.getElementById('check-chip-text');
  if (t) t.textContent = q ? `${plural(q, 'framework gap')}` : 'Framework complete';
}
function showView(name, meta){
  if (!VIEW_RENDERERS[name] || viewAccess(name) === 'none'){ name = 'dashboard'; meta = ''; }
  destroyCharts();
  const ae = document.activeElement, focusId = ae && ae.id && ae.tagName === 'INPUT' && ae.type === 'search' ? ae.id : null;
  const caret = focusId ? ae.selectionStart : null, sameView = name === currentView;
  currentView = name; currentMeta = meta || '';
  const d = DETAIL_VIEWS[name], nav = navItem(d ? d.parent : name);
  document.getElementById('tb-title').textContent = d ? d.title : (nav ? nav.label : name);
  document.getElementById('tb-crumb').textContent = navGroup(d ? d.parent : name) + (d && nav ? ' · ' + nav.label : '');
  pendingMounts = [];
  let html;
  try { html = VIEW_RENDERERS[name](meta); }
  catch(e){ console.error(e); html = emptyState('bi-bug', 'This screen could not be drawn', esc(String(e && e.message || e))); }
  document.getElementById('main').innerHTML = `<section class="view" id="view-${name}">${html}</section>`;
  pendingMounts.forEach(fn => { try { fn(); } catch(e){ console.warn('chart mount failed', e); } });
  pendingMounts = [];
  buildSidebar(); updateChrome();
  document.getElementById('sidebar').classList.remove('open'); document.getElementById('sb-backdrop').classList.remove('open');
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} } }
  else if (!sameView || !keepScroll) window.scrollTo(0, 0);
  keepScroll = false;
}
let keepScroll = false;
const redraw = () => { keepScroll = true; showView(currentView, currentMeta); };

/* ═══ 31. EVENTS — data-action delegation ═══════════════════════════════════ */
ACTIONS['go'] = t => {
  const view = t.dataset.view, meta = t.dataset.meta || '';
  if (t.dataset.nav) FILTERS[view] = {};
  if (meta.includes('=') && !DETAIL_VIEWS[view]){
    FILTERS[view] = parseMeta(meta); resetPages(view);
    if (FILTERS[view].tab) TABS[view] = FILTERS[view].tab;
    showView(view, '');
  } else showView(view, meta);
};
ACTIONS['close-modal'] = () => closeModal();
ACTIONS['modal-backdrop'] = (t, e) => { if (e.target.id === 'modal-root') closeModal(); };
ACTIONS['open-sidebar'] = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('sb-backdrop').classList.add('open'); };
ACTIONS['close-sidebar'] = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sb-backdrop').classList.remove('open'); };
ACTIONS['tbl-sort'] = t => {
  const s = TBL[t.dataset.tbl] || (TBL[t.dataset.tbl] = {sort:null, page:0});
  s.sort = s.sort && s.sort.key === t.dataset.key ? {key:t.dataset.key, dir:-s.sort.dir} : {key:t.dataset.key, dir:1};
  s.page = 0; redraw();
};
ACTIONS['tbl-page'] = t => { const s = TBL[t.dataset.tbl]; if (s){ s.page = Math.max(0, Number(t.dataset.page)); redraw(); } };
ACTIONS['tbl-csv'] = t => tableCsv(t.dataset.tbl);
ACTIONS['flt-set'] = t => { const f = F(t.dataset.scope); f[t.dataset.key] = f[t.dataset.key] === t.dataset.value ? '' : t.dataset.value; resetPages(t.dataset.scope); redraw(); };
ACTIONS['flt-clear'] = t => { delete F(t.dataset.scope)[t.dataset.key]; resetPages(t.dataset.scope); redraw(); };
ACTIONS['flt-reset'] = t => { FILTERS[t.dataset.scope] = {}; resetPages(t.dataset.scope); redraw(); };
ACTIONS['tab'] = t => { TABS[t.dataset.scope] = t.dataset.tab; redraw(); };
ACTIONS['ev-open'] = t => toast(`${t.dataset.file} — placeholder evidence file in this demonstration.`, 'ok');
CHANGES['flt'] = t => { F(t.dataset.scope)[t.dataset.key] = t.value; resetPages(t.dataset.scope); redraw(); };
function resetPages(scope){ Object.keys(TBL).forEach(k => { if (k.startsWith(scope)) TBL[k].page = 0; }); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t || t.tagName === 'SELECT' || t.tagName === 'FORM' || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'button' && t.type !== 'checkbox')) return;
  const fn = ACTIONS[t.dataset.action];
  if (fn){ if (t.tagName === 'A') e.preventDefault(); fn(t, e); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-action]'); if (t && CHANGES[t.dataset.action]) CHANGES[t.dataset.action](t, e); });
let qTimer = null;
document.addEventListener('input', e => {
  const t = e.target.closest('[data-action="flt-q"]'); if (!t) return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { F(t.dataset.scope).q = t.value; resetPages(t.dataset.scope); redraw(); }, 220);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-action]'); if (!f || !SUBMITS[f.dataset.action]) return;
  e.preventDefault(); SUBMITS[f.dataset.action](f, new FormData(f));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══ 32. AUDIT TRAIL — who, what, when, old value, new value, reason ══════ */
function addLog(text, ref, icon = 'bi-pencil-square', chg = {}){
  appData.log.unshift({ts:nowStamp(), user:currentUser.name, icon, text, ref:ref || null, old:chg.old ?? null, new:chg.new ?? null, reason:chg.reason || null, live:true});
  saveState();
}

/* ═══ 33. SELF-TEST — open with #selftest. Renders every screen against the
   sample and against awkward frameworks, and checks the model's invariants. */
function selfTest(){
  const out = [], checks = [];
  const check = (name, got, want) => checks.push({name, got, want, pass:JSON.stringify(got) === JSON.stringify(want)});
  const renderAll = label => {
    const ids = {'indicator-detail':appData.fw.indicators.slice(0, 4).map(i => i.id).concat(['I999']), 'result-detail':appData.fw.nodes.slice(0, 5).map(n => n.id).concat(['N999'])};
    Object.keys(VIEW_RENDERERS).forEach(v => { if (viewAccess(v) === 'none') return; (ids[v] || ['']).forEach(m => {
      try { pendingMounts = []; const h = VIEW_RENDERERS[v](m); pendingMounts.forEach(fn => fn()); destroyCharts();
        if (/<img src=x|<script>alert/i.test(h)) out.push(`FAIL ${label} ${v} ${m}: unescaped markup`); }
      catch(e){ out.push(`FAIL ${label} ${v} ${m}: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`); } }); });
  };
  const saved = {fw:appData.fw, source:appData.source, draft:appData.draft, overrides:appData.overrides, log:appData.log};
  // 1 · The sample
  loadSample();
  const fw = appData.fw, lv = l => fw.nodes.filter(n => n.level === l).length;
  check('Sample: 1 goal · 3 outcomes · 5 outputs · 15 activities · 17 indicators', [lv('goal'), lv('outcome'), lv('output'), lv('activity'), fw.indicators.length], [1, 3, 5, 15, 17]);
  check('Sample gaps detected: missing baseline 1.2.2 · missing verification 2.1.2 · missing target 2.2.2',
    ['1.2.2','2.1.2','2.2.2'].map(c => qualityIssues().filter(q => q.ref === fw.indicators.find(i => i.code === c).id).map(q => q.kind)),
    [['Baseline'], ['Means of verification'], ['Target', 'AI confidence']]);
  check('Every indicator with a target has results; the one without has none', fw.indicators.filter(i => (i.target !== null) !== (indResults(i).length > 0)).length, 0);
  check('Every result is labelled illustrative', appData.results.every(r => r.source_type === 'ILLUSTRATIVE'), true);
  const v1 = JSON.stringify(appData.results.map(r => r.value)); generateResults();
  check('Same logframe, same figures (seeded)', JSON.stringify(appData.results.map(r => r.value)), v1);
  check('Unverified results never reach the dashboard', fw.indicators.every(i => { const r = latestOfficial(i); return !r || OFFICIAL.includes(r.state); }), true);
  check('Percent results stay within 0–100', appData.results.filter(r => indById(r.ind).unit === '%' && (r.value < 0 || r.value > 100)).length, 0);
  check('Status mix present (on, attention or off)', statusCounts().on > 0 && statusCounts().on + statusCounts().attention + statusCounts().off >= 10, true);
  renderAll('sample');
  // 2 · Awkward extractions: no dates, no targets, future start, markup in text, empty outcomes
  const edge = [
    {title:'<img src=x onerror=alert(1)> Edge', goal:{code:'', statement:'<script>alert(1)<\/script>', indicators:[{code:'<img src=x>', name:'<img src=x onerror=alert(2)>', unit:'<b>u</b>', baseline:1, target:5, source_quote:'<img src=x>', notes:'<script>alert(3)<\/script>'}]}, outcomes:[], assumptions:[], risks:[], warnings:[]},
    {title:'No dates', goal:{statement:'Goal', indicators:[{code:'', name:'Rate', unit:'%', baseline:null, target:null, direction:'decrease'}]},
     outcomes:[{statement:'Outcome A', indicators:[{name:'Count', unit:'', baseline:5, target:5, direction:'maintain'}], outputs:[{statement:'Output', indicators:[], activities:['x']}]}]},
    {title:'Future programme', period_start:'2031', period_end:'December 2034', goal:{statement:'Goal', indicators:[{name:'People reached', unit:'people', baseline:0, target:1000, target_year:'2034'}]}, outcomes:[]},
    {title:'Year-only dates', period_start:'Jan 2024', period_end:'2026', goal:{statement:'Goal', indicators:[{name:'Mortality', unit:'per 1,000', baseline:40, target:20, direction:'decrease'}]}, outcomes:[]}
  ];
  edge.forEach((x, k) => { try { const f2 = normaliseFramework(x); adoptFramework(f2, {kind:'ai', filename:`edge-${k}`, model:'test'}); renderAll(`edge${k}`); }
    catch(e){ out.push(`FAIL edge${k} normalise: ${e && e.message}`); } });
  // The review screen, with a hostile and a normal extraction pending.
  [edge[0], SAMPLE_FRAMEWORK, edge[1]].forEach((x, k) => { appData.draft = {fw:normaliseFramework(x), source:{kind:'ai', filename:'<b>review</b>', model:'test'}};
    try { const h = VIEW_RENDERERS['review'](''); if (/<img src=x|<script>alert|<b>review/i.test(h)) out.push(`FAIL review${k}: unescaped markup`); }
    catch(e){ out.push(`FAIL review${k}: ${e && e.message}`); } });
  appData.draft = null;
  check('Future programme gets an illustrative six-quarter window', (() => { adoptFramework(normaliseFramework(edge[2]), {kind:'ai', filename:'f'}); return [appData.fw.timelineShifted, appData.quarters.length]; })(), [true, 6]);
  check('Year-only dates parse to 1 Jan 2024 – 31 Dec 2026', (() => { const f3 = normaliseFramework(edge[3]); return [f3.periodStart, f3.periodEnd]; })(), ['2024-01-01', '2026-12-31']);
  check('A decreasing indicator falls from baseline', (() => { adoptFramework(normaliseFramework(edge[3]), {kind:'ai', filename:'d'}); const R = appData.results; return R.length > 1 && R[R.length - 1].value < 40; })(), true);
  // restore
  Object.assign(appData, saved); if (appData.fw) generateResults();
  const fails = checks.filter(c => !c.pass);
  out.unshift(`CHECKS ${checks.length - fails.length}/${checks.length}` + fails.map(f => `\n  CHECKFAIL ${f.name}: got ${JSON.stringify(f.got)} want ${JSON.stringify(f.want)}`).join(''));
  out.push(`VIEWS ${Object.keys(VIEW_RENDERERS).length} · RESULTS ${out.filter(x => x.startsWith('FAIL')).length} failures`);
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}

/* ═══ 34. INIT ══════════════════════════════════════════════════════════════ */
(function init(){
  const hash = location.hash.replace('#', '');
  if (hash === 'selftest'){ loadSample(); selfTest(); showView('dashboard'); return; }
  if (loadState()) generateResults(); else loadSample();
  im_checkStatus();
  const [v, m] = hash.split('/');
  const meta = decodeURIComponent(m || '');
  if (v && VIEW_RENDERERS[v]){
    if (meta.includes('=') && !DETAIL_VIEWS[v]){ FILTERS[v] = parseMeta(meta); showView(v, ''); } else showView(v, meta);
  } else showView(appData.draft ? 'review' : 'dashboard');
})();
</script>
</body>
