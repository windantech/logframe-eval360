<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Eval360 · Your Logframe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1. TOKENS. Brand sits in --brand / --brand-deep / --accent so a client's real
   colours swap in one place (Administration → Settings does it live).
   Nothing below hardcodes a colour except inside the token block.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f3f5f7; --card:#ffffff; --muted:#e8ecf0;
  --ink:#0f1c2a; --ink-soft:#384858; --ink-mute:#677686;
  --line:#d3dae2; --line-soft:#e4e9ee;
  --brand:#27466e; --brand-deep:#152a47; --brand-soft:#e4eaf3;   /* Eval360 product palette */
  --accent:#b4532a; --accent-soft:#f8e7de;                        /* used sparingly: one thing at a time */
  --ok:#1f7a45; --warn:#b86e0b; --bad:#a32424; --info:#6a4bb8;
  --ok-soft:#e1f2e7; --warn-soft:#fbeed2; --bad-soft:#f7e2e0; --info-soft:#ece7f8;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,28,42,.04),0 0 0 1px rgba(15,28,42,.05);
  --shadow-lg:0 12px 34px rgba(15,28,42,.13),0 0 0 1px rgba(15,28,42,.06);
  --sidebar-w:252px;
  --topbar-h:60px;
}

/* ═══ 2. BASE ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,'Times New Roman',serif;margin:0;text-wrap:balance}
.mono,code{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-mute)}
.small{font-size:11.5px}

/* ═══ 3. LAYOUT — fixed sidebar + sticky topbar + content ═════════════════ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sb{background:var(--brand-deep);color:#e6edf4;display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:40}
.sb-brand{display:flex;gap:10px;align-items:center;padding:15px 16px 13px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-mark{width:40px;height:40px;border-radius:9px;flex-shrink:0;background:#fff;color:var(--brand-deep);
  display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:11.5px;letter-spacing:-.03em}
.sb-mark.has-logo{padding:3px}
.sb-mark img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.sb-brand-name{font-family:'Fraunces',serif;font-size:13.5px;font-weight:600;line-height:1.22}
.sb-brand-sub{font-size:9.5px;color:rgba(230,237,244,.56);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 0 6px;scrollbar-width:thin}
.sb-scroll::-webkit-scrollbar{width:6px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.sb-group{padding:11px 16px 4px;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(230,237,244,.44)}
.nav-item{display:flex;align-items:center;gap:10px;padding:6px 16px;color:rgba(230,237,244,.84);
  font-size:12.8px;cursor:pointer;border:0;border-left:3px solid transparent;background:none;width:100%;text-align:left}
.nav-item i.bi{font-size:14px;width:16px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.11);color:#fff;border-left-color:var(--accent);font-weight:600}
.nav-badge{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px}
.nav-badge.urgent{background:var(--bad)}
.nav-badge.warn{background:var(--warn)}
.sb-foot{padding:10px 16px 13px;border-top:1px solid rgba(255,255,255,.1)}
.checkchip{display:flex;align-items:center;gap:6px;width:100%;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);color:rgba(230,237,244,.8);border-radius:7px;padding:6px 9px;
  font-size:10.5px;cursor:pointer;text-align:left}
.checkchip:hover{background:rgba(255,255,255,.12)}
.checkchip i{color:#7fd3a0}
.sb-powered{font-size:9.5px;color:rgba(230,237,244,.45);margin-top:8px;letter-spacing:.04em}

.tb{position:sticky;top:0;z-index:30;height:var(--topbar-h);background:rgba(243,245,247,.93);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
.tb-hamburger{display:none;background:none;border:0;font-size:19px;color:var(--ink);cursor:pointer}
.tb-titles{min-width:0;flex:1}
.tb-crumb{font-size:10.5px;color:var(--ink-mute);letter-spacing:.05em;text-transform:uppercase}
.tb-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-tools{display:flex;align-items:center;gap:9px;flex-shrink:0}
.tb-search{position:relative}
.tb-search i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-mute)}
.tb-search input{width:200px;padding:6px 10px 6px 27px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);font-size:12.5px;color:var(--ink)}
.sel{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:6px 9px;font-size:12.5px;
  color:var(--ink);cursor:pointer;max-width:230px}
.sel-wrap{display:flex;align-items:center;gap:6px}
.sel-lbl{font-size:10.5px;color:var(--ink-mute);white-space:nowrap}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:32px;
  cursor:pointer;color:var(--ink-soft);display:grid;place-items:center;font-size:15px}
.bell:hover{background:var(--card)}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:2px;text-align:left}
.avatar{width:31px;height:31px;border-radius:50%;flex-shrink:0;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:700}
.who-n{font-size:12px;font-weight:600;line-height:1.2;color:var(--ink)}
.who-r{font-size:10.5px;color:var(--ink-mute);line-height:1.2}

.content{grid-column:2;display:flex;flex-direction:column;min-width:0}
.demo-strip{background:var(--brand-soft);color:var(--brand);font-size:11.5px;padding:5px 22px;
  border-bottom:1px solid var(--line-soft);display:flex;gap:7px;align-items:center}
.demo-strip i{font-size:12px}
.main{padding:22px;max-width:1440px;width:100%;margin:0 auto;flex:1}

/* ═══ 4. COMPONENTS ════════════════════════════════════════════════════════ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-head{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:14.5px;font-weight:600}
.card-head .ch-sub{font-size:11.5px;color:var(--ink-mute)}
.card-body{padding:16px}
.sec-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:3px}
.sec-sub{font-size:12.5px;color:var(--ink-mute);margin-bottom:14px;max-width:96ch}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:600;line-height:1.25}
.page-head .ph-sub{font-size:12.5px;color:var(--ink-mute);margin-top:3px;max-width:90ch}
.page-head .ph-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:18px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(.94);background:var(--accent)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(.94);background:var(--bad)}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--muted)}
.btn-sm{padding:4px 9px;font-size:11.5px}
.linkish{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font:inherit;text-align:left;
  text-decoration:none;border-bottom:1px dotted currentColor}
.linkish:hover{color:var(--brand-deep)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip i{font-size:10px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.grey{background:var(--muted);color:var(--ink-mute)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.solid-bad{background:var(--bad);color:#fff}
.demo-tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-mute);border:1px dashed var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}

/* KPI tiles — buttons, because every number drills down */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;
  box-shadow:var(--shadow);text-align:left;color:inherit;display:block;width:100%;position:relative;font:inherit}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--brand);box-shadow:var(--shadow-lg)}
button.kpi::after{content:'\F285';font-family:'bootstrap-icons';position:absolute;right:11px;top:12px;font-size:10px;color:var(--ink-mute);opacity:0}
button.kpi:hover::after{opacity:1}
.kpi .k-lbl{font-size:10.5px;color:var(--ink-mute);letter-spacing:.03em;text-transform:uppercase;line-height:1.3;padding-right:12px}
.kpi .k-val{font-family:'Fraunces',serif;font-size:25px;font-weight:700;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11.5px;color:var(--ink-mute);margin-top:3px;line-height:1.4}
.kpi.tone-bad{border-left:3px solid var(--bad)} .kpi.tone-warn{border-left:3px solid var(--warn)} .kpi.tone-ok{border-left:3px solid var(--ok)}

.prog{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;margin:6px 0 3px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.prog i.ok{background:var(--ok)} .prog i.warn{background:var(--warn)} .prog i.bad{background:var(--bad)}
.prog.tall{height:9px}
.dual{position:relative;height:9px;border-radius:5px;background:var(--muted);overflow:visible;margin:5px 0}
.dual i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand)}
.dual u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;text-decoration:none}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.mb{margin-bottom:18px}
.chart-wrap{position:relative;height:250px;padding:6px 10px 10px}
.chart-wrap.short{height:200px}
.chart-wrap.tall{height:300px}

/* Tables */
.tbl-scroll{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{text-align:left;padding:9px 11px;background:var(--muted);border-bottom:1px solid var(--line);font-size:9.5px;
  font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute);white-space:nowrap;user-select:none}
.dt th.sortable{cursor:pointer}
.dt th.sortable:hover{color:var(--ink)}
.dt th .si{font-size:9px;margin-left:3px;opacity:.75}
.dt td{padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.45}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr.clickable{cursor:pointer}
.dt tbody tr.clickable:hover td{background:var(--brand-soft)}
.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt td.c,.dt th.c{text-align:center}
.dt tr.grp td{background:var(--brand-soft);font-weight:600;font-size:11.5px;color:var(--brand)}
.dt tr.flag td{background:var(--bad-soft)}
.dt tfoot td{border-top:2px solid var(--line);font-weight:700;background:var(--muted);font-variant-numeric:tabular-nums}
.dt .sub{display:block;font-size:11px;color:var(--ink-mute);margin-top:1px}
.dt .code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--ink-mute);flex-wrap:wrap}
.pager{display:flex;gap:4px;align-items:center}

.kv{width:100%;border-collapse:collapse;font-size:12.5px}
.kv td{padding:7px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.kv td:first-child{color:var(--ink-mute);width:40%;padding-right:12px}
.kv tr:last-child td{border-bottom:none}

/* Filter bar */
.filterbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.filterbar select,.filterbar input[type=search]{border:1px solid var(--line);border-radius:7px;background:var(--card);
  padding:6px 9px;font-size:12px;color:var(--ink);font-family:inherit;max-width:220px}
.filterbar .fb-lbl{font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-right:2px}
.filterbar .spacer{flex:1}
.fpill{border:1px solid var(--line);border-radius:99px;background:var(--card);padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-soft)}
.fpill.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.fpill b{font-variant-numeric:tabular-nums;margin-left:3px}
.active-filter{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:99px;
  padding:3px 6px 3px 11px;font-size:11.5px;font-weight:600}
.active-filter button{border:0;background:rgba(0,0,0,.06);color:inherit;border-radius:99px;width:18px;height:18px;cursor:pointer;line-height:1;font-size:12px}

/* Banners */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.banner i{font-size:14px;flex-shrink:0;margin-top:1px}
.banner.info{background:var(--brand-soft);color:var(--brand-deep);border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft);color:#6f4307;border:1px solid #ecd29a}
.banner.bad{background:var(--bad-soft);color:#701b1b;border:1px solid #e9b9b4}
.banner.ok{background:var(--ok-soft);color:#155a32;border:1px solid #b5dcc3}
.banner .b-act{margin-left:auto;flex-shrink:0;align-self:center}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-size:12.8px;font-weight:500;color:var(--ink-mute);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tab .cnt{font-size:10px;background:var(--muted);border-radius:99px;padding:0 6px;color:var(--ink-mute)}
.tab .cnt.bad{background:var(--bad);color:#fff}

/* Hero (executive greeting, record headers) */
.hero{background:linear-gradient(118deg,var(--brand-deep) 0%,var(--brand) 70%);color:#eef3f8;border-radius:var(--radius);
  padding:20px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h2{font-size:22px;font-weight:600;color:#fff;margin-bottom:4px}
.hero .hsub{font-size:13px;color:rgba(238,243,248,.8)}
.hero .hpill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:99px;
  padding:2px 10px;font-size:11px;font-weight:600;margin-bottom:9px}
.hero .hmeta{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16)}
.hero .hmeta div{font-size:11px;color:rgba(238,243,248,.62)}
.hero .hmeta b{display:block;font-size:14.5px;color:#fff;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.hero-points{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-pt{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
.hero-pt:hover{background:rgba(255,255,255,.18)}
.hero-pt b{font-family:'Fraunces',serif;font-size:15px}
.hero-pt i.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.hero .h-score{position:absolute;right:24px;top:20px;text-align:right}
.hero .h-score b{font:700 44px/1 'Fraunces',serif;color:#fff;font-variant-numeric:tabular-nums}
.hero .h-score span{display:block;font-size:11px;color:rgba(238,243,248,.66);margin-top:4px}

/* Strategic objective bars */
.so-row{display:grid;grid-template-columns:44px minmax(0,1fr) 170px 52px 112px;gap:12px;align-items:center;
  padding:10px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.so-row:hover{background:var(--brand-soft)}
.so-row:last-child{border-bottom:0}
.so-code{font:600 11px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.so-name{font-size:13px;font-weight:600;line-height:1.35}
.so-name small{display:block;font-weight:400;color:var(--ink-mute);font-size:11px}
.so-pct{font:700 17px 'Fraunces',serif;text-align:right;font-variant-numeric:tabular-nums}

/* Alerts and feed */
.alert-grp{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 2px;display:flex;align-items:center;gap:6px}
.alert-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.alert-item > i{font-size:14px;flex-shrink:0;margin-top:1px}
.alert-item .a-t{font-weight:600}
.alert-item .a-d{color:var(--ink-mute);font-size:11.5px;margin-top:1px}
.alert-item button{margin-left:auto;flex-shrink:0;align-self:center}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.feed-item:last-child{border-bottom:none}
.feed-item .f-ic{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;background:var(--muted);font-size:12px;color:var(--ink-soft)}
.feed-item .f-t{font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-mute);width:64px;flex-shrink:0;padding-top:4px}
.feed-item .f-d{color:var(--ink-mute);font-size:11px;margin-top:1px}

/* Split bar (status distribution) */
.split-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:8px 0}
.split-bar button{display:flex;align-items:center;justify-content:center;font:700 11px/1 'Inter',sans-serif;color:#fff;
  white-space:nowrap;border:0;cursor:pointer;padding:0 6px;min-width:0;overflow:hidden}
.split-bar button:hover{filter:brightness(1.1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Results chain / cycle */
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:4px 0}
.chain-step{padding:14px 16px;border:1px solid var(--line);border-right:0;background:var(--card);position:relative}
.chain-step:first-child{border-radius:9px 0 0 9px}
.chain-step:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0}
.chain-step .cs-l{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.chain-step .cs-v{font:700 24px/1.15 'Fraunces',serif;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.chain-step .cs-d{font-size:12px;color:var(--ink-soft);line-height:1.5}
.cycle{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cycle button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.cycle button:hover{border-color:var(--brand);color:var(--brand)}
.cycle i.bi-arrow-right{color:var(--ink-mute);font-size:11px}

/* Strategy cascade tree */
.tree-node{border-bottom:1px solid var(--line-soft)}
.tree-row{display:flex;align-items:center;gap:10px;padding:9px 12px}
.tree-row:hover{background:var(--muted)}
.tree-tw{width:18px;flex-shrink:0;text-align:center;font-size:10px;color:var(--ink-mute);background:none;border:0;cursor:pointer;padding:2px 0}
.tree-lvl{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute);background:var(--muted);padding:1px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.tree-code{font:500 11px 'JetBrains Mono',monospace;color:var(--ink-mute);flex-shrink:0;min-width:70px}
.tree-body{flex:1;min-width:0;font-size:12.8px}
.tree-right{display:flex;gap:9px;align-items:center;flex-shrink:0}
.tree-kids{margin-left:24px;border-left:1px solid var(--line)}

/* Mini record cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);
  text-align:left;font:inherit;color:inherit;width:100%;display:block}
button.mini{cursor:pointer}
button.mini:hover{border-color:var(--brand)}
.mini .m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mini .m-code{font:500 10.5px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.mini .m-t{font-size:13px;font-weight:600;line-height:1.35;margin:3px 0 6px}
.mini .m-big{font:700 22px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.mini .m-rows{margin-top:9px;font-size:11.5px}
.mini .m-r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.mini .m-r:last-child{border-bottom:none}
.mini .m-r span:first-child{color:var(--ink-mute)}
.mini .m-r span:last-child{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}

/* Health score */
.health{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:130px;height:130px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 32px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.ring b small{display:block;font:500 10.5px 'Inter',sans-serif;color:var(--ink-mute);text-align:center;margin-top:4px}
.hs-row{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:12px;padding:4px 0}
.hs-row span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Risk heat map */
.heat{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));gap:4px;font-size:11px}
.heat .hl{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:var(--ink-mute);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.heat .hb{text-align:center;color:var(--ink-mute);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:4px}
.heat button{height:64px;border-radius:7px;border:1px solid transparent;cursor:pointer;font:700 20px 'Fraunces',serif;color:var(--ink)}
.heat button:hover{border-color:var(--ink)}
.heat button small{display:block;font:600 9.5px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.heat .r-low{background:var(--ok-soft)} .heat .r-moderate{background:#f3f0cf} .heat .r-high{background:var(--warn-soft)} .heat .r-critical{background:var(--bad-soft)}

/* Kanban-ish board (management actions) */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:var(--muted);border-radius:9px;padding:9px}
.bcol-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.bcol-h span{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute)}
.bcol-h b{font:700 15px 'Fraunces',serif;font-variant-numeric:tabular-nums}
.bcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:7px;padding:9px 10px;
  margin-bottom:7px;font-size:11.5px;cursor:pointer;display:block;width:100%;text-align:left;font-family:inherit;color:inherit}
.bcard:hover{border-color:var(--brand)}
.bcard.overdue{border-left-color:var(--bad)} .bcard.progress{border-left-color:var(--warn)} .bcard.done{border-left-color:var(--ok)} .bcard.pending{border-left-color:var(--info)}
.bcard .bc-id{font:500 10px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.bcard .bc-t{font-weight:600;margin:2px 0 4px;line-height:1.35}
.bcard .bc-m{color:var(--ink-mute);font-size:10.5px;line-height:1.4}

/* Checklist (inspection) */
.check-row{display:grid;grid-template-columns:28px minmax(0,1fr) 170px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.check-row:last-child{border-bottom:none}
.check-row i{font-size:15px}

/* Timeline (workflow history) */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 13px 22px;font-size:12px;line-height:1.5}
.tl li::before{content:'';position:absolute;left:5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.tl li::after{content:'';position:absolute;left:8.5px;top:15px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li .tl-d{font-size:10.5px;color:var(--ink-mute);font-family:'JetBrains Mono',monospace}

/* Workflow stepper */
.stepper{display:flex;flex-wrap:wrap;margin:4px 0 2px}
.step{display:flex;align-items:center;gap:8px;flex:1 1 120px;min-width:120px;padding:8px 10px;border:1px solid var(--line);border-right:0;background:var(--card);font-size:11.5px}
.step:first-child{border-radius:8px 0 0 8px}
.step:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.step .s-n{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--muted);color:var(--ink-mute)}
.step.done{background:var(--ok-soft)} .step.done .s-n{background:var(--ok);color:#fff}
.step.doing{background:var(--warn-soft)} .step.doing .s-n{background:var(--warn);color:#fff}
.step.stop{background:var(--bad-soft)} .step.stop .s-n{background:var(--bad);color:#fff}

/* Evidence list */
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.ev:last-child{border-bottom:none}
.ev .ev-ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--muted);flex-shrink:0;font-size:14px;color:var(--ink-soft)}
.ev .ev-n{font-weight:500;word-break:break-all}
.ev .ev-m{font-size:11px;color:var(--ink-mute)}

/* Region schematic */
.region-map{width:100%;max-width:420px;display:block;margin:0 auto}
.region-map .rg{cursor:pointer}
.region-map .rg:hover path{filter:brightness(.94)}
.region-map text{font-family:'Inter',sans-serif;pointer-events:none}

/* Search */
.sr-group{margin-bottom:16px}
.sr-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.sr-item:hover{background:var(--brand-soft)}
.sr-item mark{background:#fdf0b5;color:inherit;border-radius:2px;padding:0 1px}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.fld label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);
  font-family:inherit;font-size:13px;color:var(--ink)}
.fld textarea{resize:vertical;min-height:70px;line-height:1.5}
.fld .hint{font-size:11px;color:var(--ink-mute);margin-top:4px;line-height:1.45}
.fld input[readonly]{background:var(--muted)}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:80;background:rgba(15,28,42,.48);display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);width:100%;max-width:680px}
.modal.wide{max-width:1000px}
.modal-head{padding:15px 19px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font-size:15.5px;font-weight:600}
.modal-body{padding:19px}
.modal-foot{padding:13px 19px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-x{background:none;border:0;font-size:19px;color:var(--ink-mute);cursor:pointer;line-height:1}
.modal-x:hover{color:var(--ink)}

/* Toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#f1f5f9;border-radius:8px;padding:10px 14px;font-size:12.5px;box-shadow:var(--shadow-lg);
  display:flex;align-items:flex-start;gap:8px;max-width:380px;animation:toastIn .22s ease-out}
.toast i{font-size:13px;flex-shrink:0;margin-top:1px}
.toast.ok i{color:#7fd3a0} .toast.warn i{color:#f0c070} .toast.bad i{color:#f09a90}
@keyframes toastIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* Empty */
.empty{text-align:center;padding:40px 24px;color:var(--ink-soft)}
.empty i{font-size:28px;color:var(--ink-mute);opacity:.6}
.empty h4{margin:10px 0 6px;font:700 15px/1.3 'Fraunces',serif;color:var(--ink)}
.empty p{margin:0 auto;max-width:52ch;font-size:12.5px;line-height:1.6}

/* Notifications */
.nt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:13px;align-items:start;background:var(--card);border:1px solid var(--line);
  border-left-width:3px;border-radius:var(--radius);padding:13px 15px;margin-bottom:9px}
.nt.now{border-left-color:var(--bad)} .nt.soon{border-left-color:var(--warn)} .nt.fyi{border-left-color:var(--info)}
.nt-ic{width:36px;height:36px;border-radius:9px;background:var(--muted);display:grid;place-items:center;font-size:15px;color:var(--ink-soft)}
.nt.now .nt-ic{background:var(--bad-soft);color:var(--bad)} .nt.soon .nt-ic{background:var(--warn-soft);color:var(--warn)}
.nt-t{font:600 13.5px/1.4 'Inter',sans-serif;margin-bottom:3px}
.nt-w{font-size:12px;line-height:1.5;color:var(--ink-soft)}
.nt-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px;white-space:nowrap}

/* Walkthrough */
.tour-step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.tour-step:last-child{border-bottom:0}
.tour-n{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 14px 'Fraunces',serif}
.tour-step h4{font:600 13.5px/1.35 'Inter',sans-serif;margin-bottom:3px}
.tour-step p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.tour-say{margin-top:7px;padding:8px 11px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 7px 7px 0;font-size:12.5px;font-style:italic;color:var(--ink)}

/* Report centre + document */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.rep-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.rep-card h4{font:600 13.5px/1.35 'Inter',sans-serif}
.rep-card p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5}
.rep-card .rc-foot{margin-top:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rep-card .rc-ic{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:15px}
.doc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.doc-bar .spacer{flex:1}
.doc-wrap{background:var(--muted);padding:22px;border-radius:var(--radius);overflow-x:auto}
.doc{background:#fff;color:#14202c;max-width:860px;margin:0 auto;padding:46px 54px 56px;box-shadow:0 2px 18px rgba(15,28,42,.14);font:13px/1.62 'Inter',sans-serif}
.doc .d-brand{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:20px;gap:20px}
.doc .d-brand b{font:700 13px 'Fraunces',serif;color:var(--brand)}
.doc .d-brand span{font-size:10.5px;color:#66727e;display:block}
.doc h1{font:700 21px/1.3 'Fraunces',serif;margin:0 0 4px}
.doc .doc-sub{font-size:12px;color:#5d6a77;margin-bottom:6px}
.doc h2{font:700 14.5px/1.35 'Fraunces',serif;margin:24px 0 8px;padding-bottom:5px;border-bottom:1.5px solid #14202c}
.doc h3{font:700 12.5px/1.35 'Inter',sans-serif;margin:16px 0 6px}
.doc p{margin:0 0 10px}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0 14px}
.doc th,.doc td{border:1px solid #bcc6d0;padding:5px 8px;text-align:left;vertical-align:top}
.doc th{background:#eef2f6;font-weight:700;font-size:10.5px}
.doc td.n,.doc th.n{text-align:right;font-variant-numeric:tabular-nums}
.doc .narr{background:#f4f7fb;border-left:3px solid var(--brand);padding:11px 14px;margin:0 0 11px;border-radius:0 6px 6px 0}
.doc .narr-tag{font:700 9px/1 'Inter',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#66727e;margin-bottom:6px;display:block}
.doc .d-disc{margin-top:26px;padding-top:9px;border-top:1px solid #d5dce3;font-size:10px;color:#6f7b87;display:flex;justify-content:space-between;gap:14px}
.doc .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.doc .kpis div{border:1px solid #d5dce3;border-radius:6px;padding:8px 10px}
.doc .kpis b{display:block;font:700 18px 'Fraunces',serif}
.doc .kpis span{font-size:10px;color:#66727e;text-transform:uppercase;letter-spacing:.04em}
.doc .rag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* Settings */
.swatch{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.swatch input[type="color"]{width:38px;height:30px;border:1px solid var(--line);border-radius:7px;background:none;padding:2px;cursor:pointer}
.swatch label{font-size:12.5px;flex:1}
.swatch code{font:500 11px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.perm{width:100%;border-collapse:collapse;font-size:12px}
.perm th,.perm td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left}
.perm thead th{font:700 9.5px/1.3 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);background:var(--muted);border-bottom:1px solid var(--line)}
.perm td.c,.perm th.c{text-align:center}
.perm .yes{color:var(--ok)} .perm .ro{color:var(--info)} .perm .no{color:var(--line)}

/* Provenance badges — public vs synthetic (brief §108–§110) */
.prov{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border-radius:5px;padding:1px 6px;white-space:nowrap;line-height:1.6;vertical-align:middle;font-family:'Inter',sans-serif}
.prov i{font-size:10px}
.prov.pub{background:var(--ok-soft);color:var(--ok);border:1px solid transparent;cursor:pointer}
.prov.pub:hover{border-color:var(--ok)}
.prov.demo{color:var(--ink-mute);border:1px dashed var(--line);background:transparent;cursor:help}
.prov.calc{color:var(--accent);background:var(--accent-soft);cursor:help}
.zone{border-radius:var(--radius);padding:14px 16px 4px;margin-bottom:18px}
.zone.pub{background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)) padding-box;border:1px solid #b9dcc6}
.zone.demo{border:1px dashed var(--line);background:var(--card)}
.zone-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.zone-h h3{font:600 14px 'Fraunces',serif}
.zone .kpi-row{margin-bottom:12px}
.quad{position:relative}
.quad-lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

/* ═══ 5. LOGIN ═════════════════════════════════════════════════════════════ */
.login{position:fixed;inset:0;z-index:100;background:linear-gradient(140deg,var(--brand-deep) 0%,var(--brand) 100%);
  display:none;align-items:center;justify-content:center;padding:28px;overflow-y:auto}
.login.open{display:flex}
.login-box{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);background:var(--card);
  border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden}
.login-l{padding:36px 34px;background:var(--bg);display:flex;flex-direction:column}
.login-l .lm{width:52px;height:52px;border-radius:12px;background:var(--brand-deep);color:#fff;display:grid;place-items:center;
  font:700 17px 'Fraunces',serif;margin-bottom:22px}
.login-l h1{font-size:25px;font-weight:600;line-height:1.2;margin-bottom:10px}
.login-l .ls{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:24px}
.login-l .lorg{font-size:11.5px;color:var(--ink-mute);letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.login-form .fld{margin-bottom:12px}
.login-l .lfoot{margin-top:auto;padding-top:22px;font-size:11.5px;color:var(--ink-mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.login-l .lfoot b{color:var(--brand)}
.login-r{padding:30px 30px 26px}
.login-r h3{font:600 15px 'Fraunces',serif;margin-bottom:4px}
.login-r .lr-sub{font-size:12px;color:var(--ink-mute);margin-bottom:14px;line-height:1.5}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   EVAL360 — BRING YOUR OWN LOGFRAME
   A visitor imports their own logical framework; the server-side AI proxy
   (api/extract.php) turns it into a structured results framework; the visitor
   reviews and corrects it; Eval360 then runs on it — dashboard, logframe
   matrix, indicators, verification workflow, data quality, reports.

   Provenance is the rule that matters:
     IMPORTED       structure, wording, baselines, targets — the visitor's own
     AI-EXTRACTED   how each item got in (reviewed by the visitor before use)
     ILLUSTRATIVE   every progress figure — generated, never presented as real

   Same single-file conventions as the FPC / CIC / KDC / CAAZ demonstrations:
   no build step, no framework, data-action events, every figure derived.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══ 1. CLOCK — the real date: visitors import live programmes ════════════ */
const TODAY_ISO = new Date().toISOString().slice(0, 10);
let clockMinutes = new Date().getHours() * 60 + new Date().getMinutes();

/* ═══ 2. SEEDED RANDOM — the same logframe always gives the same figures ═══ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){ let h = 2166136261; for (const ch of String(s)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
let rand = mulberry32(1);
const rint  = (a, b) => a + Math.floor(rand() * (b - a + 1));
const pick  = arr => arr[Math.floor(rand() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ═══ 3. FORMATTING ═════════════════════════════════════════════════════════ */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d = 0) => v === null || v === undefined || isNaN(v) ? '—'
  : Number(v).toLocaleString('en-GB', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct  = (n, d) => d ? Math.round(n / d * 1000) / 10 : 0;
const r1   = v => Math.round(v * 10) / 10;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){
  if (!d) return '—';
  const [y, m, dd] = String(d).slice(0, 10).split('-').map(Number);
  return `${dd} ${MONTHS[m - 1]} ${y}`;
}
/* Date arithmetic in UTC throughout. */
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b){ return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }
const daysFromToday = iso => daysBetween(TODAY_ISO, iso);
function nowStamp(){ return `${TODAY_ISO} ${String(Math.floor(clockMinutes / 60)).padStart(2,'0')}:${String(clockMinutes % 60).padStart(2,'0')}`; }
const slugFile = s => String(s).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0, 60) || 'logframe';
const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : (many || one + 's')}`;
/* Quarters — calendar quarters, labelled "Q3 2026". */
const quarterOf = iso => { const [y, m] = iso.split('-').map(Number); return {y, q:Math.floor((m - 1) / 3) + 1}; };
const qStart = (y, q) => `${y}-${String((q - 1) * 3 + 1).padStart(2,'0')}-01`;
const qEnd = (y, q) => addDays(q === 4 ? `${y + 1}-01-01` : qStart(y, q + 1), -1);
const qLabel = (y, q) => `Q${q} ${y}`;

/* ═══ 4. STATE — the single source of truth ═════════════════════════════════ */
const appData = {
  fw:null,          // the accepted results framework (normalised)
  source:null,      // {kind:'sample'|'ai'|'mock', filename, model, extractedAt, reviewedAt}
  draft:null,       // an extraction awaiting review: {fw, source}
  results:[],       // illustrative quarterly results — regenerated from fw

  log:[],           // audit trail
  settings:{tolerance:10},
  ai:{checked:false, available:false, mock:false, model:'', remaining:null, limits:null}
};
const currentUser = {name:'You', title:'Programme team', role:'you'};
const ROLE_LABEL = {you:'You'};
const STORE_KEY = 'eval360.logframe.v1';

/* ═══ 5. NAVIGATION ═════════════════════════════════════════════════════════ */
const NAV = [
  {group:'Overview', items:[
    {key:'dashboard',  icon:'bi-speedometer2',      label:'Programme dashboard'},
    {key:'import',     icon:'bi-upload',            label:'Import logframe'},
    {key:'review',     icon:'bi-ui-checks',         label:'Review import'}]},
  {group:'Results framework', items:[
    {key:'matrix',     icon:'bi-table',             label:'Logframe matrix'},
    {key:'chain',      icon:'bi-diagram-3',         label:'Results chain'},
    {key:'indicators', icon:'bi-graph-up',          label:'Indicators'}]},
  {group:'Monitoring', items:[
    {key:'submissions',icon:'bi-check2-square',     label:'Data submissions'},
    {key:'quality',    icon:'bi-clipboard-check',   label:'Data quality'},
    {key:'activity',   icon:'bi-clock-history',     label:'Audit trail'}]},
  {group:'Reports', items:[
    {key:'reports',    icon:'bi-file-earmark-text', label:'Reports & export'}]},
  {group:'About', items:[
    {key:'about',      icon:'bi-info-circle',       label:'How this works'}]}
];
const DETAIL_VIEWS = {
  'indicator-detail':{parent:'indicators', title:'Indicator'},
  'result-detail':   {parent:'chain',      title:'Result'}
};
const navItem = key => NAV.flatMap(g => g.items).find(i => i.key === key);
const navGroup = key => (NAV.find(g => g.items.some(i => i.key === key)) || {}).group || '';
/* One visitor, full access — the shared UI helpers ask anyway. */
const access = () => 'full';
const viewAccess = v => v === 'review' && !appData.draft ? 'none' : 'full';
const canEdit = () => true;

/* No published-source register in this demo; the shared badge helpers expect one. */
const PUBLIC = {}, SOURCES = {};

/* ═══════════════════════════════════════════════════════════════════════════
   6. SAMPLE LOGFRAME — a fictional programme, in exactly the shape the AI
   extraction returns (api/lib.php lf_schema), so it travels the same path as
   an import. It has deliberate gaps (a missing baseline, a missing target, a
   missing means of verification) so the data-quality screen has work to show.
   ═══════════════════════════════════════════════════════════════════════════ */
const SAMPLE_IND = (code, name, unit, baseline, target, o = {}) => Object.assign({
  code, name, unit, baseline, baseline_year:baseline === null ? null : '2024', target, target_year:target === null ? null : '2027',
  direction:'increase', frequency:'Quarterly', means_of_verification:'Programme monitoring database', disaggregation:'Sex, district',
  source_quote:name, confidence:'high', notes:null}, o);
const SAMPLE_FRAMEWORK = {
  is_logframe:true, not_logframe_reason:null,
  title:'Resilient Water, Sanitation and Hygiene Programme',
  organisation:'Sample Development Agency (fictional)', country:'Fictional — three districts',
  period_start:'2025-01-01', period_end:'2027-12-31', currency:'USD',
  summary:'A three-year programme to extend safe water and sanitation to rural households and schools, and to strengthen district water governance.',
  goal:{code:'G', statement:'Improved health and resilience of rural households in the three target districts', indicators:[
    SAMPLE_IND('G.1', 'Incidence of diarrhoeal disease among children under five', 'cases per 1,000 children', 182, 120, {direction:'decrease', frequency:'Annual', means_of_verification:'District health information system'}),
    SAMPLE_IND('G.2', 'Households reporting reduced water-related losses during drought', '%', 22, 60, {frequency:'Annual', means_of_verification:'Household survey'})]},
  outcomes:[
    {code:'1', statement:'Rural households use safely managed drinking water', assumptions:['Groundwater yields remain within design levels'], indicators:[
      SAMPLE_IND('1.1', 'Population using safely managed drinking water', '%', 38, 70, {means_of_verification:'Household survey; water point records'}),
      SAMPLE_IND('1.2', 'Functional water points', '%', 64, 90)],
     outputs:[
      {code:'1.1', statement:'Water points constructed or rehabilitated', assumptions:[], activities:['Hydrogeological surveys','Borehole drilling','Rehabilitation of hand pumps'], indicators:[
        SAMPLE_IND('1.1.1', 'Water points constructed or rehabilitated', 'water points', 0, 420),
        SAMPLE_IND('1.1.2', 'People with new or improved access to water', 'people', 0, 126000)]},
      {code:'1.2', statement:'Water point committees trained and operational', assumptions:['Communities contribute to maintenance funds'], activities:['Committee formation','Training in operation and maintenance','Spare-parts supply chain'], indicators:[
        SAMPLE_IND('1.2.1', 'Water point committees trained', 'committees', 0, 380),
        SAMPLE_IND('1.2.2', 'Committee members who are women', '%', null, 50, {confidence:'medium', notes:'Baseline not stated in the document.'})]}]},
    {code:'2', statement:'Households and schools adopt improved sanitation and hygiene practices', assumptions:['No major cholera outbreak diverts district staff'], indicators:[
      SAMPLE_IND('2.1', 'Households using at least basic sanitation', '%', 27, 55, {means_of_verification:'Household survey'}),
      SAMPLE_IND('2.2', 'Open-defecation-free communities certified', 'communities', 0, 240)],

        SAMPLE_IND('2.1.1', 'Communities triggered', 'communities', 0, 400),
        SAMPLE_IND('2.1.2', 'Latrines built by households', 'latrines', 0, 18000, {means_of_verification:null, confidence:'medium', notes:'Means of verification not stated.'})]},
      {code:'2.2', statement:'Schools equipped with WASH facilities', assumptions:[], activities:['School latrine blocks','Handwashing stations','Menstrual hygiene rooms'], indicators:[
        SAMPLE_IND('2.2.1', 'Schools with basic WASH services', 'schools', 12, 150),
        SAMPLE_IND('2.2.2', 'Pupils reached with hygiene education', 'pupils', 0, null, {confidence:'low', notes:'Target described as "all pupils in target schools" — no number given.'})]}]},
    {code:'3', statement:'District water governance strengthened', assumptions:['District budgets for WASH are released on time'], indicators:[
      SAMPLE_IND('3.1', 'Districts with an approved and budgeted WASH plan', 'districts', 0, 3, {frequency:'Annual'})],
     outputs:[
      {code:'3.1', statement:'District WASH monitoring systems in place', assumptions:[], activities:['Water point mapping','Monitoring system roll-out','Quarterly review meetings'], indicators:[
        SAMPLE_IND('3.1.1', 'Water points mapped in the district monitoring system', '%', 15, 100),
        SAMPLE_IND('3.1.2', 'Quarterly district WASH review meetings held', 'meetings', 0, 36)]}]}],
  assumptions:['Security conditions allow access to all target districts', 'Exchange-rate movements stay within budget contingency'],
  risks:['Drought reduces groundwater yields', 'Delays in procurement of drilling contractors', 'Staff turnover in district water offices'],

/* ═══════════════════════════════════════════════════════════════════════════
   7. MODEL — normalise an extraction, generate illustrative progress,
   calculate status, check data quality, persist in this browser.
   ═══════════════════════════════════════════════════════════════════════════ */
const LEVELS = {goal:'Goal', outcome:'Outcome', output:'Output', activity:'Activity'};
const LEVEL_ICON = {goal:'bi-bullseye', outcome:'bi-flag', output:'bi-box-seam', activity:'bi-list-task'};

/* Loose date reading: "2025", "Jan 2025", "2025-03", "31/12/2027" → ISO. */
function parseLooseDate(s, end){
  if (!s) return null;
  s = String(s).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{4})-(\d{2})$/))) return end ? addDays(Number(m[2]) === 12 ? `${Number(m[1]) + 1}-01-01` : `${m[1]}-${String(Number(m[2]) + 1).padStart(2,'0')}-01`, -1) : `${m[1]}-${m[2]}-01`;
  const yr = s.match(/(19|20)\d{2}/);
  if (!yr) return null;
  const mo = MONTHS.findIndex(x => new RegExp('\\b' + x, 'i').test(s));
  if (mo >= 0){ const st = `${yr[0]}-${String(mo + 1).padStart(2,'0')}-01`; return end ? addDays(mo === 11 ? `${Number(yr[0]) + 1}-01-01` : `${yr[0]}-${String(mo + 2).padStart(2,'0')}-01`, -1) : st; }
  return end ? `${yr[0]}-12-31` : `${yr[0]}-01-01`;
}
const numOrNull = v => v === null || v === undefined || v === '' || isNaN(Number(v)) ? null : Number(v);
const str = v => v === null || v === undefined ? '' : String(v).trim();

/* API shape (nested) → app shape (flat nodes + indicators). Tolerant of gaps:
   whatever the AI returns, the review screen can show it. */
function normaliseFramework(x){
  const fw = {title:str(x.title) || 'Imported logframe', organisation:str(x.organisation), country:str(x.country), currency:str(x.currency),
    summary:str(x.summary), periodStartRaw:str(x.period_start), periodEndRaw:str(x.period_end),
    nodes:[], indicators:[], assumptions:(x.assumptions || []).map(str).filter(Boolean), risks:(x.risks || []).map(str).filter(Boolean),
    warnings:(x.warnings || []).map(str).filter(Boolean)};
  let n = 0, k = 0;
  const addNode = (level, code, statement, parent, assumptions) => {
    const node = {id:`N${++n}`, level, code:str(code) || '', statement:str(statement), parent, assumptions:(assumptions || []).map(str).filter(Boolean)};
    fw.nodes.push(node); return node;
  };
  const addInds = (node, list) => (list || []).forEach((i, j) => fw.indicators.push({
    id:`I${++k}`, node:node.id, code:str(i.code) || `${node.code || node.level}.i${j + 1}`, name:str(i.name), unit:str(i.unit),
    baseline:numOrNull(i.baseline), baselineYear:str(i.baseline_year), target:numOrNull(i.target), targetYear:str(i.target_year),
    dir:['increase','decrease','maintain'].includes(i.direction) ? i.direction : 'increase', frequency:str(i.frequency), mov:str(i.means_of_verification),
    disagg:str(i.disaggregation), quote:str(i.source_quote), confidence:['high','medium','low'].includes(i.confidence) ? i.confidence : 'medium',
    notes:str(i.notes), prov:'imported'}));

  const goal = addNode('goal', g.code || 'G', g.statement || '', null, []);
  addInds(goal, g.indicators);
  (x.outcomes || []).forEach((o, i) => {
    const on = addNode('outcome', o.code || String(i + 1), o.statement, goal.id, o.assumptions);
    addInds(on, o.indicators);
    (o.outputs || []).forEach((p, j) => {
      const pn = addNode('output', p.code || `${on.code}.${j + 1}`, p.statement, on.id, p.assumptions);
      addInds(pn, p.indicators);
      (p.activities || []).forEach((a, q) => addNode('activity', `${pn.code}.a${q + 1}`, a, pn.id, []));
    });

/* The programme period, from the document if it says, otherwise inferred and flagged. */
function resolvePeriod(fw){
  let start = parseLooseDate(fw.periodStartRaw, false), end = parseLooseDate(fw.periodEndRaw, true);
  const ty = fw.indicators.map(i => parseInt(i.targetYear, 10)).filter(y => y > 1990 && y < 2100);
  const by = fw.indicators.map(i => parseInt(i.baselineYear, 10)).filter(y => y > 1990 && y < 2100);
  fw.periodAssumed = [];
  if (!end && ty.length){ end = `${Math.max(...ty)}-12-31`; fw.periodAssumed.push('end date taken from the latest target year'); }
  if (!start && by.length){ start = `${Math.max(...by) + 1}-01-01`; fw.periodAssumed.push('start date taken from the baseline year'); }
  if (!end && start){ end = addDays(`${Number(start.slice(0, 4)) + 3}-01-01`, -1); fw.periodAssumed.push('three-year duration assumed'); }
  if (!start && end){ start = `${Number(end.slice(0, 4)) - 2}-01-01`; fw.periodAssumed.push('three-year duration assumed'); }
  if (!start){ start = qStart(quarterOf(addDays(TODAY_ISO, -540)).y, quarterOf(addDays(TODAY_ISO, -540)).q); end = addDays(`${Number(start.slice(0, 4)) + 3}-01-01`, -1); fw.periodAssumed.push('no dates in the document — an illustrative three-year period is used'); }

/* ── Lookups ─────────────────────────────────────────────────────────────── */
const nodeById = id => appData.fw.nodes.find(n => n.id === id);

const nodeLabel = n => `${LEVELS[n.level]}${n.code && n.level !== 'goal' ? ' ' + n.code : ''}`;

const unitLabel = ind => ind.unit === '%' ? 'percent' : ind.unit || 'units not stated';

/* ═══ 8. ILLUSTRATIVE PROGRESS ══════════════════════════════════════════════
   Quarterly results from the programme start to the last completed quarter.
   Seeded by the framework and indicator, so the same logframe always gives the
   same figures. Never presented as real: every value carries the demo badge. */
function reportingQuarters(fw){
  const last = quarterOf(addDays(qStart(quarterOf(TODAY_ISO).y, quarterOf(TODAY_ISO).q), -1));   // last completed quarter
  let s = quarterOf(fw.periodStart);
  const Q = [];
  let y = s.y, q = s.q;
  while (y < last.y || (y === last.y && q <= last.q)){ Q.push({y, q, id:`${y}-Q${q}`, label:qLabel(y, q), end:qEnd(y, q)}); q++; if (q > 4){ q = 1; y++; } }
  fw.timelineShifted = false;
  if (Q.length < 3){
    // Not started (or just started): show an illustrative six-quarter window so the screens have something to track.
    fw.timelineShifted = true;
    const out = []; let yy = last.y, qq = last.q;
    for (let i = 0; i < 6; i++){ out.unshift({y:yy, q:qq, id:`${yy}-Q${qq}`, label:qLabel(yy, qq), end:qEnd(yy, qq)}); qq--; if (qq < 1){ qq = 4; yy--; } }
    return out;
  }
  return Q.slice(-12);
}
/* Baseline used for illustration when the document gives none — flagged everywhere it shows. */
function effectiveBaseline(ind){
  if (ind.baseline !== null) return {v:ind.baseline, assumed:false};
  if (ind.target === null) return {v:null, assumed:false};
  if (ind.dir === 'decrease') return {v:r1(ind.target * 1.6), assumed:true};
  if (ind.dir === 'maintain') return {v:ind.target, assumed:true};
  return {v:ind.unit === '%' ? r1(ind.target * .5) : 0, assumed:true};
}
function generateResults(){
  const fw = appData.fw, Q = reportingQuarters(fw);
  appData.quarters = Q;
  const t0 = Q.length && fw.timelineShifted ? qStart(Q[0].y, Q[0].q) : fw.periodStart;
  const span = Math.max(1, daysBetween(t0, fw.timelineShifted ? addDays(t0, 365 * 3) : fw.periodEnd));
  const R = [];
  // Performance band by rank of a hash, not a coin toss: every logframe shows the intended mix
  // (about 60% on track, 25% needs attention, 15% off track) and the same logframe always the same.
  const tracked = fw.indicators.filter(i => i.target !== null && effectiveBaseline(i).v !== null)
    .map(i => ({id:i.id, h:hashStr(fw.title + '#' + i.code + '#' + i.name)})).sort((a, b) => a.h - b.h);
  const band = {}; tracked.forEach((t, k) => { const f = (k + .5) / tracked.length; band[t.id] = f < .6 ? 'on' : f < .85 ? 'attention' : 'off'; });
  fw.indicators.forEach(ind => {
    rand = mulberry32(hashStr(fw.title + '|' + ind.code + '|' + ind.name));
    const b = effectiveBaseline(ind);
    if (b.v === null || ind.target === null) return;               // nothing to track against
    const perf = band[ind.id] === 'on' ? 1.01 + rand() * .14 : band[ind.id] === 'attention' ? 0.925 + rand() * .035 : 0.6 + rand() * .22;
    const integer = Number.isInteger(ind.target) && Number.isInteger(b.v) && ind.unit !== '%';
    Q.forEach((q, i) => {
      const f = clamp(daysBetween(t0, q.end) / span, 0, 1);
      const expected = ind.dir === 'maintain' ? ind.target : b.v + (ind.target - b.v) * f;
      let v = ind.dir === 'maintain' ? ind.target * (perf >= .97 ? 1 : perf) + (rand() - .5) * Math.abs(ind.target) * .02
                                     : b.v + (ind.target - b.v) * f * clamp(perf + (rand() - .5) * .03, .4, 1.25);
      if (ind.unit === '%') v = clamp(v, 0, 100);
      v = integer ? Math.max(0, Math.round(v)) : r1(Math.max(0, v));
      const latest = i === Q.length - 1;
      const st = !latest ? 'Locked' : (() => { const r = rand(); return r < .72 ? 'Verified' : r < .84 ? 'Submitted' : r < .93 ? 'Under Review' : 'Draft'; })();
      R.push({id:`R-${ind.id}-${q.id}`, ind:ind.id, quarter:q.id, label:q.label, value:v, expected:integer ? Math.round(expected) : r1(expected),
        state:appData.overrides[`R-${ind.id}-${q.id}`] || st, evidence:st === 'Draft' ? [] : [`${slugFile(ind.code)}_${q.id}_data.xlsx`], source_type:'ILLUSTRATIVE'});
    });

}
const OFFICIAL = ['Verified','Locked'];
const indResults = ind => appData.results.filter(r => r.ind === ind.id);
/* Latest official result — unverified figures never reach the dashboard. */
function latestOfficial(ind){ const L = indResults(ind).filter(r => OFFICIAL.includes(r.state)); return L[L.length - 1] || null; }

/* ═══ 9. STATUS ═════════════════════════════════════════════════════════════ */
const STATUS = {
  on:{key:'on', label:'On track', tone:'ok', icon:'bi-check-circle-fill'},
  attention:{key:'attention', label:'Needs attention', tone:'warn', icon:'bi-exclamation-circle-fill'},
  off:{key:'off', label:'Off track', tone:'bad', icon:'bi-x-circle-fill'},
  none:{key:'none', label:'No verified result', tone:'grey', icon:'bi-dash-circle'},
  notarget:{key:'notarget', label:'Target needed', tone:'grey', icon:'bi-question-circle'}
};
const TONE_VAR = {ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)', grey:'var(--ink-mute)', info:'var(--info)', brand:'var(--brand)', accent:'var(--accent)'};
/* Progress made against progress expected by now (direction-aware), with the tolerance band. */
function indStatus(ind){
  if (ind.target === null) return STATUS.notarget;
  const r = latestOfficial(ind); if (!r) return STATUS.none;
  const b = effectiveBaseline(ind).v;
  let ratio;
  if (ind.dir === 'maintain') ratio = 1 - Math.abs(r.value - ind.target) / Math.max(1e-9, Math.abs(ind.target));
  else { const want = r.expected - b, got = r.value - b; ratio = Math.abs(want) < 1e-9 ? 1 : got / want; }
  return ratio >= .98 ? STATUS.on : ratio >= 1 - appData.settings.tolerance / 100 ? STATUS.attention : STATUS.off;
}
/* Share of the end-of-programme change achieved so far. */
function indAchievement(ind){
  const r = latestOfficial(ind), b = effectiveBaseline(ind).v;
  if (!r || ind.target === null || b === null) return null;
  if (ind.dir === 'maintain') return clamp(100 - Math.abs(r.value - ind.target) / Math.max(1e-9, Math.abs(ind.target)) * 100, 0, 100);
  return Math.abs(ind.target - b) < 1e-9 ? 100 : clamp((r.value - b) / (ind.target - b) * 100, 0, 150);
}
function statusCounts(list = appData.fw.indicators){
  const c = {on:0, attention:0, off:0, none:0, notarget:0};
  list.forEach(i => c[indStatus(i).key]++);
  return c;
}
/* Performance index: on track counts 1, needs attention ½, among indicators that have a verified result. */
function perfIndex(list = appData.fw.indicators){
  const c = statusCounts(list), n = c.on + c.attention + c.off;
  return n ? r1((c.on + c.attention / 2) / n * 100) : null;
}
/* A result's own rollup: its indicators and everything below it. */
function subtreeInds(nodeId){
  const ids = [nodeId], out = [];
  for (let i = 0; i < ids.length; i++) childNodes(ids[i]).forEach(c => ids.push(c.id));
  return appData.fw.indicators.filter(x => ids.includes(x.node));
}

/* ═══ 10. DATA QUALITY — what the logframe still needs ══════════════════════ */
function qualityIssues(fw = appData.fw){
  const I = [], add = (sev, kind, text, ref) => I.push({sev, kind, text, ref});
  fw.indicators.forEach(i => {
    const tag = `${i.code} — ${i.name}`;
    if (!i.name) add('bad', 'Indicator', 'Indicator has no name', i.id);
    if (i.target === null) add('bad', 'Target', `${tag}: no numeric target — progress cannot be assessed`, i.id);
    if (i.baseline === null) add('warn', 'Baseline', `${tag}: no baseline${i.target !== null ? ' — an illustrative baseline is assumed' : ''}`, i.id);
    if (!i.mov) add('warn', 'Means of verification', `${tag}: no means of verification`, i.id);
    if (!i.unit) add('warn', 'Unit', `${tag}: unit not stated`, i.id);
    if (!i.frequency) add('info', 'Frequency', `${tag}: reporting frequency not stated`, i.id);
    if (i.confidence === 'low' && i.prov === 'imported') add('info', 'AI confidence', `${tag}: the AI was unsure about this indicator — check it against the document`, i.id);
  });
  resultNodes(fw).forEach(n => { if (!nodeInds(n.id, fw).length) add('warn', 'Coverage', `${nodeLabel(n)} has no indicator — its achievement cannot be measured`, n.id); });
  (fw.periodAssumed || []).forEach(p => add('info', 'Period', `Programme period: ${p}`, null));
  return I;
}

/* ── Tables: sortable, paged, exportable ────────────────────────────────

function tableCsv(id){
  const t = TBL_DATA[id]; if (!t) return;
  const strip = h => String(h ?? '').replace(/<[^>]*>/g, ' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g, ' ').trim();
  const val = (c, r) => c.csv ? c.csv(r) : c.sv ? c.sv(r) : c.render ? strip(c.render(r)) : r[c.key];
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [t.cols.map(c => q(c.label)).join(',')].concat(t.rows.map(r => t.cols.map(c => q(val(c, r))).join(',')));
  downloadBlob(`Eval360_${slugFile(t.name)}_${TODAY_ISO}.csv`, 'text/csv;charset=utf-8', '﻿' + lines.join('\r\n'));
  toast(`${plural(t.rows.length, 'row')} exported to CSV — opens in Excel. Demonstration data.`, 'ok');
}
function downloadBlob(name, mime, content){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  '--ok':'#1f7a45','--warn':'#b86e0b','--bad':'#a32424','--info':'#4c4bb8','--brand-soft':'#e3ebf4','--line':'#d3dae2'};
function chartTheme(){

          ok:t('--ok'), warn:t('--warn'), bad:t('--bad'), info:t('--info'), soft:t('--brand-soft'), grid:t('--line')};

function chartConfig(cfg){

  const base = {responsive:true, maintainAspectRatio:false, animation:{duration:300},
    plugins:{legend:{display:false, labels:{color:T.ink, font:{size:10.5}, boxWidth:10, boxHeight:10}},
             tooltip:{enabled:true}}};

    base.scales = {x:{grid:{display:false}, ticks:{color:T.mute, font:{size:10}}},
                   y:{grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}, beginAtZero:true}};

function deepMerge(a, b){
  const out = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  Object.keys(b).forEach(k => {
    out[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') ? deepMerge(a[k], b[k]) : b[k];

  return out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   20. IMPORT — read the visitor's file in the browser, send it to the AI
   proxy, then REVIEW: nothing an AI read goes live until a person accepts it.

   Word and Excel are converted to text here (the host cannot open .docx /
   .xlsx — no ZipArchive). PDFs go to the AI as files. Converters load from the
   CDN only when needed.
   ═══════════════════════════════════════════════════════════════════════════ */
const API_BASE = 'api/';
const LIBS = {
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const im_state = {busy:null, error:null, abort:null, paste:''};
const im_loaded = {};
function im_loadScript(url){
  if (im_loaded[url]) return im_loaded[url];
  return im_loaded[url] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = () => { delete im_loaded[url]; rej(new Error('Could not load the file converter. Check the connection, or save the file as PDF.')); }; document.head.appendChild(s); });
}
/* Word HTML → text that keeps table rows together: "cell | cell | cell". */
function im_htmlToText(html){
  const doc = new DOMParser().parseFromString(html, 'text/html'), out = [];
  const walk = el => { for (const c of el.children){
    if (c.tagName === 'TABLE'){ c.querySelectorAll('tr').forEach(tr => out.push([...tr.children].map(td => td.textContent.replace(/\s+/g, ' ').trim()).join(' | '))); out.push(''); }
    else if (/^(P|H[1-6]|LI)$/.test(c.tagName)){ const t = c.textContent.replace(/\s+/g, ' ').trim(); if (t) out.push((c.tagName === 'LI' ? '- ' : '') + t); }
    else walk(c); } };
  walk(doc.body);
  return out.join('\n');
}
function im_b64(buf){ let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
async function im_filePayload(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf'){
    const maxMb = (appData.ai.limits && appData.ai.limits.max_pdf_mb) || 8;
    if (file.size > maxMb * 1048576) throw new Error(`This PDF is ${r1(file.size / 1048576)} MB; the limit is ${maxMb} MB. Upload only the pages with the logframe.`);
    return {kind:'pdf', filename:file.name, file_base64:im_b64(await file.arrayBuffer()), chars:null};
  }
  let text;
  const unreadable = kind => new Error(`This ${kind} file could not be read in the browser. Save it as PDF and upload that instead.`);
  if (ext === 'docx'){ await im_loadScript(LIBS.mammoth);
    try { text = im_htmlToText((await window.mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()})).value); } catch(e){ console.warn(e); throw unreadable('Word'); } }
  else if (['xlsx','xlsm','xls','ods'].includes(ext)){ await im_loadScript(LIBS.xlsx);
    try { const wb = window.XLSX.read(await file.arrayBuffer(), {type:'array'});
      text = wb.SheetNames.map(n => `### Sheet: ${n}\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[n], {blankrows:false})).join('\n\n'); } catch(e){ console.warn(e); throw unreadable('spreadsheet'); } }
  else if (['csv','tsv','txt','md','json'].includes(ext)) text = await file.text();
  else if (['doc','ppt','pptx','rtf','odt'].includes(ext)) throw new Error(`.${ext} files cannot be read here. Save the document as PDF or .docx and try again.`);
  else throw new Error('Unsupported file type. Use PDF, Word (.docx), Excel (.xlsx), CSV or plain text.');
  text = String(text || '').replace(/\n{3,}/g, '\n\n').trim();
  if (text.length < 80) throw new Error('Almost no text could be read from this file. If it is a scan, export it as PDF and upload that instead.');
  return {kind:'text', filename:file.name, text, chars:text.length};
}

/* ── AI status — asked once; tells the page whether import is switched on ── */
async function im_checkStatus(){
  try {
    const r = await fetch(API_BASE + 'status.php', {cache:'no-store'});
    const d = await r.json();
    Object.assign(appData.ai, {checked:true, available:!!d.ai, mock:!!d.mock, model:d.model || '', remaining:d.remaining_today, limits:d.limits || null});
  } catch(e){ Object.assign(appData.ai, {checked:true, available:false, offline:true}); }
  updateChrome();
  if (currentView === 'import') redraw();
}

/* ── The call ───────────────────────────────────────────────────────────── */
async function im_run(getPayload, label){
  if (im_state.busy) return;
  im_state.error = null; im_state.busy = {label, step:'Reading the document', started:Date.now()}; redraw();
  try {
    const payload = await getPayload();
    im_state.busy.step = payload.kind === 'pdf' ? 'The AI is reading the PDF and structuring the logframe' : `The AI is structuring ${num(payload.chars)} characters of text`;
    redraw();
    const ctl = new AbortController(); im_state.abort = ctl;
    const resp = await fetch(API_BASE + 'extract.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:ctl.signal});
    let d; try { d = await resp.json(); } catch(e){ throw new Error(`The server returned an unexpected response (${resp.status}). AI import needs the hosted demo with PHP.`); }
    if (!d.ok) throw new Error(d.error || 'The import failed.');
    if (d.meta && d.meta.remaining_today !== undefined) appData.ai.remaining = d.meta.remaining_today;
    const x = d.framework;
    if (!x.is_logframe) throw new Error(`This does not look like a results framework: ${x.not_logframe_reason || 'no goal, outcomes or indicators were found'}.`);
    const fw = normaliseFramework(x);
    if (!fw.indicators.length && fw.nodes.length < 2) throw new Error('No results or indicators could be read from this document.');
    appData.draft = {fw, source:{kind:d.meta.model === 'mock' ? 'mock' : 'ai', filename:d.meta.filename || label, model:d.meta.model, extractedAt:d.meta.extracted_at, reviewedAt:null}};
    im_state.busy = null; saveState();
    addLog(`imported "${label}" — AI extracted ${plural(fw.indicators.length, 'indicator')}, awaiting review`, {view:'review', meta:''}, 'bi-stars');
    showView('review');
    toast(`Read ${plural(fw.nodes.filter(n => n.level === 'outcome').length, 'outcome')} and ${plural(fw.indicators.length, 'indicator')}. Review them before they go live.`, 'ok');
  } catch(e){
    im_state.busy = null;
    im_state.error = e.name === 'AbortError' ? 'Import cancelled.' : (e instanceof TypeError ? 'Could not reach the AI service. AI import works on the hosted demo, not from a file opened on your computer.' : e.message);
    redraw();
  } finally { im_state.abort = null; }
}

  i.prov = i.prov === 'added' ? 'added' : 'edited';

};
ACTIONS['rv-add-ind'] = t => {
  const fw = rv_fw(); const n = fw && fw.nodes.find(x => x.id === t.dataset.id); if (!n) return;
  const k = Math.max(0, ...fw.indicators.map(i => Number(i.id.slice(1)) || 0)) + 1;
  fw.indicators.push({id:`I${k}`, node:n.id, code:`${n.code}.i${nodeInds(n.id, fw).length + 1}`, name:'', unit:'', baseline:null, baselineYear:'', target:null, targetYear:'',
    dir:'increase', frequency:'Quarterly', mov:'', disagg:'', quote:'', confidence:'high', notes:'', prov:'added'});
  saveState(); redraw();
};
ACTIONS['rv-del-ind'] = t => { const fw = rv_fw(); if (!fw) return; fw.indicators = fw.indicators.filter(i => i.id !== t.dataset.id); saveState(); redraw(); };
ACTIONS['rv-del-node'] = t => {
  const fw = rv_fw(); if (!fw) return;
  const ids = [t.dataset.id]; for (let i = 0; i < ids.length; i++) fw.nodes.filter(n => n.parent === ids[i]).forEach(n => ids.push(n.id));
  const n = fw.nodes.find(x => x.id === t.dataset.id);
  if (!confirm(`Remove ${nodeLabel(n)} and everything under it (${ids.length - 1} results/activities, ${fw.indicators.filter(i => ids.includes(i.node)).length} indicators)?`)) return;
  fw.nodes = fw.nodes.filter(x => !ids.includes(x.id)); fw.indicators = fw.indicators.filter(i => !ids.includes(i.node));

};

ACTIONS['rv-accept'] = () => {

/* Status of an indicator as it stood at a past quarter — for the trend. */
function statusAt(ind, qid){
  if (ind.target === null) return null;
  const r = appData.results.find(x => x.ind === ind.id && x.quarter === qid); if (!r) return null;
  const b = effectiveBaseline(ind).v;
  const ratio = ind.dir === 'maintain' ? 1 - Math.abs(r.value - ind.target) / Math.max(1e-9, Math.abs(ind.target))
    : Math.abs(r.expected - b) < 1e-9 ? 1 : (r.value - b) / (r.expected - b);
  return ratio >= .98 ? 'on' : ratio >= 1 - appData.settings.tolerance / 100 ? 'attention' : 'off';
}
function indexAt(qid){
  const S = appData.fw.indicators.map(i => statusAt(i, qid)).filter(Boolean);
  return S.length ? r1((S.filter(s => s === 'on').length + S.filter(s => s === 'attention').length / 2) / S.length * 100) : null;
}

/* ═══ Logframe matrix — the classic four columns ════════════════════════════ */
function lfMatrixRows(fw, forPrint){
  const indCell = n => { const L = nodeInds(n.id, fw); return L.length ? `<ul>${L.map(i => `<li><b>${esc(i.code)}</b> ${esc(i.name)}${i.unit ? ` <span class="${forPrint ? '' : 'muted'}">(${esc(i.unit)})</span>` : ''}<br>

  const movCell = n => { const L = nodeInds(n.id, fw); return L.length ? `<ul>${L.map(i => `<li>${i.mov ? esc(i.mov) : '<i>not stated</i>'}</li>`).join('')}</ul>` : ''; };
  const asCell = (n, extra = []) => { const A = n.assumptions.concat(extra); return A.length ? `<ul>${A.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''; };
  const row = (n, extra) => {
    const acts = n.level === 'output' ? childNodes(n.id, fw).filter(a => a.level === 'activity') : [];
    const name = forPrint ? `${esc(n.statement)}` : go('result-detail', n.id, esc(n.statement));
    return `<tr class="${n.level}"><td class="lvl">${esc(nodeLabel(n))}</td><td>${name}${acts.length ? `<div style="margin-top:6px;font-size:11px"><b>Activities:</b> ${acts.map(a => esc(a.statement)).join('; ')}</div>` : ''}</td>
      <td>${indCell(n)}</td><td>${movCell(n)}</td><td>${asCell(n, extra || [])}</td></tr>`;
  };
  const goal = fw.nodes.find(n => n.level === 'goal');
  let html = goal ? row(goal, fw.assumptions) : '';
  fw.nodes.filter(n => n.level === 'outcome').forEach(o => { html += row(o); childNodes(o.id, fw).filter(p => p.level === 'output').forEach(p => { html += row(p); }); });
  return `<table class="lfm"><thead><tr><th>Level</th><th>Results (narrative summary)</th><th>Indicators · baseline → target</th><th>Means of verification</th><th>Assumptions</th></tr></thead><tbody>${html}</tbody></table>`;
